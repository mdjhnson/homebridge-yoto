name: npm bump

on:
  workflow_dispatch:
    inputs:
      newversion:
        description: 'npm version {major,minor,patch}'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_COLOR: 1

concurrency: # prevent concurrent releases
  group: npm-bump
  cancel-in-progress: true

jobs:
  version_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit/tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed
    steps:
    - uses: actions/checkout@v6
      with:
        # fetch full history so things like auto-changelog work properly
        fetch-depth: 0
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: '24' # ships npm 11, required for trusted publishing
        registry-url: 'https://registry.npmjs.org'
    - run: npm ci
    - run: npm test
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: npm version
      run: npm version ${{ inputs.newversion }} -m "%s"
    # Publish before pushing, so a failed publish doesn't leave a tag for a
    # version that was never released. Trusted publishing can only be set up on
    # a package that already exists on npm, so the very first release must be
    # published by hand (npm publish) before this workflow can publish.
    - name: npm publish
      run: npm publish
    - name: Push version commit and tag
      run: git push --follow-tags
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Use this version's CHANGELOG.md section as the release notes (Homebridge
      # verification expects notes on every release), or GitHub's generated notes
      # when the section is empty.
      run: |
        TAG="v$(node -p "require('./package.json').version")"
        awk -v tag="$TAG" '/^## /{ if (found) exit; if (index($0, "[" tag "]") || $0 ~ ("^## " tag "( |$)")) { found=1; next } } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
        if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
        else
          gh release create "$TAG" --title "$TAG" --generate-notes
        fi
