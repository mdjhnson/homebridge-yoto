name: npm bump

on:
  workflow_dispatch:
    inputs:
      newversion:
        description: 'npm version {major,minor,patch}'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_COLOR: 1

concurrency: # prevent concurrent releases
  group: npm-bump
  cancel-in-progress: true

jobs:
  version_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit/tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN needed
    steps:
    - uses: actions/checkout@v6
      with:
        # fetch full history so things like auto-changelog work properly
        fetch-depth: 0
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: '24' # ships npm 11, required for trusted publishing
        registry-url: 'https://registry.npmjs.org'
    - run: npm i
    - run: npm test
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: npm version
      run: npm version ${{ inputs.newversion }} -m "%s"
    - name: Push version commit and tag
      run: git push --follow-tags
    - name: npm publish
      run: npm publish
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v$(node -p "require('./package.json').version")"
        gh release create "$TAG" --title "$TAG" --generate-notes
